<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Rehearsal Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Schibsted+Grotesk:wght@500;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}[hidden]{display:none!important}
</style>
<style>
/* Layout: one narrow column. Song list, then each song is one document: key, recordings, do re mi notes, lyrics. */
:root {
  --bg: #F4F6F5; --surface: #FFFFFF; --ink: #14201D; --muted: #5C6B67; --line: #DCE3E0;
  --accent: #0B6E63; --on-accent: #FFFFFF; --accent-soft: #DDF0EC; --danger: #B3261E;
  --key-white: #FFFFFF; --key-in: #CFEAE4; --key-ink: #14201D; --key-black: #1B2825;
  --font-ui: 'Schibsted Grotesk', system-ui, sans-serif;
  --font-body: 'Atkinson Hyperlegible', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1513; --surface: #162120; --ink: #E7EFEC; --muted: #93A6A0; --line: #26332F;
    --accent: #55D1BE; --on-accent: #04201C; --accent-soft: #1B3A35; --danger: #FF8A80;
    --key-white: #1E2B29; --key-in: #2E6B61; --key-ink: #E7EFEC; --key-black: #050908; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.wrap > * { min-width: 0; }
h1, h2 { font-family: var(--font-ui); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 1.75rem; overflow-wrap: anywhere; }
h2 { font-size: 1.1rem; }
p { margin: 0; }
.sub { color: var(--muted); font-size: .9rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn {
  font-family: var(--font-ui); font-weight: 500; font-size: .95rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 9px 14px; border-radius: 10px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; text-align: center;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.danger { color: var(--danger); }
.btn.big { min-height: 60px; font-size: 1.1rem; flex: 1; }
label.btn { margin: 0; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-family: var(--font-ui); font-weight: 500; text-align: left; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 44px; }
textarea { min-height: 220px; resize: vertical; line-height: 1.6; }
textarea.mono { font-family: var(--font-mono); font-size: .95rem; white-space: pre; overflow-x: auto; }
label { font-family: var(--font-ui); font-weight: 500; font-size: .85rem; color: var(--muted); display: block; margin-bottom: 4px; }

.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.head > div { min-width: 0; }
.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 2px; text-align: left; width: 100%; }
.kb { font-family: var(--font-mono); font-weight: 600; font-size: 1.05rem; color: var(--accent); background: var(--accent-soft); border-radius: 10px; height: 44px; display: grid; place-items: center; }
.rt { display: flex; flex-direction: column; min-width: 0; }
.rt b { font-family: var(--font-ui); font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
.rt small, .rn { color: var(--muted); font-size: .85rem; }
.empty { color: var(--muted); padding: 12px 2px; max-width: 48ch; }

.keycard { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; }
.keycard .lbl { display: block; font-family: var(--font-ui); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.keycard b { font-family: var(--font-ui); font-size: 1.35rem; color: var(--accent); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.blk { display: flex; flex-direction: column; gap: 10px; }

.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: 20px; }
.line { padding: 3px 8px; border-radius: 8px; overflow-wrap: anywhere; }
.follow .line[data-li] { cursor: pointer; }
.line.on { background: var(--accent-soft); font-weight: 700; }
.vs { font-family: var(--font-ui); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .72em; color: var(--muted); margin: 1.1em 0 .3em 8px; }
.vs:first-child { margin-top: 0; }
.gap { height: .5em; }
.solfa { margin: 0; font-family: var(--font-mono); font-size: 1rem; line-height: 1.8; white-space: pre; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }

.kbd { position: relative; display: flex; height: 176px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--key-white); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.wk { flex: 1; min-width: 0; border: 0; border-right: 1px solid var(--line); background: var(--key-white); color: var(--key-ink); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; padding: 0 0 8px; }
.wk:last-of-type { border-right: 0; }
.wk.in { background: var(--key-in); }
.wk.tonic { background: var(--accent); color: var(--on-accent); }
.wk .sf { font-family: var(--font-mono); font-weight: 600; font-size: 1rem; min-height: 1.4em; }
.wk .nm { font-size: .62rem; opacity: .7; }
.bk { position: absolute; top: 0; height: 58%; width: 4.3%; z-index: 2; border: 0; border-radius: 0 0 6px 6px; background: var(--key-black); color: #fff; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-family: var(--font-mono); font-weight: 600; font-size: .7rem; }
.bk.in { background: var(--accent); color: var(--on-accent); }
.bk.tonic { outline: 2px solid var(--ink); outline-offset: -2px; }
.down { filter: brightness(.85); }
.legend { font-size: .9rem; color: var(--muted); }

.recs { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.rec { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-bottom: 1px solid var(--line); }
.recmain { background: none; border: 0; text-align: left; padding: 10px 2px; display: flex; flex-direction: column; min-width: 0; }
.recmain b { font-family: var(--font-ui); }
.recmain small { color: var(--muted); }
.recmain[aria-pressed="true"] b { color: var(--accent); }
.x { background: none; border: 0; color: var(--muted); font-size: 1.2rem; min-width: 44px; height: 44px; }
.rtime { font-family: var(--font-mono); margin-left: 6px; }
.dock { position: sticky; bottom: 8px; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.player { display: flex; align-items: center; gap: 10px; }
.player input[type="range"] { min-height: 0; padding: 0; border: 0; background: none; accent-color: var(--accent); flex: 1; min-width: 80px; }
.player span { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.nextline { font-size: 1.2rem; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }

.form { display: flex; flex-direction: column; gap: 14px; }
.err { color: var(--danger); font-size: .9rem; min-height: 1.2em; }
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<audio id="aud" preload="metadata"></audio>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var uid = function () { return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); };
  var LS = 'rehearsalbook.songs.v3', SEEDED = 'rehearsalbook.seeded.v3';
  var aud = $('#aud');

  /* ---------- keys and sound ---------- */
  var IDX = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
  var SH = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  var FL = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
  var MAJ = ['C', 'C#', 'Db', 'D', 'D#', 'Eb', 'E', 'F', 'F#', 'Gb', 'G', 'G#', 'Ab', 'A', 'A#', 'Bb', 'B'];
  var MIN = ['Cm', 'C#m', 'Dm', 'Ebm', 'Em', 'Fm', 'F#m', 'Gm', 'G#m', 'Am', 'Bbm', 'Bm'];
  var FLATKEYS = ['F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb', 'Dm', 'Gm', 'Cm', 'Fm', 'Bbm', 'Ebm'];
  var mod12 = function (n) { return ((n % 12) + 12) % 12; };
  function parseKey(k) {
    var m = String(k || '').match(/^([A-G][#b]?)(m?)$/);
    return m && IDX[m[1]] !== undefined ? { root: IDX[m[1]], minor: !!m[2], name: m[1] } : null;
  }
  function keyLabel(k) { var p = parseKey(k); return p ? p.name + (p.minor ? ' minor' : ' major') : (k || 'No key'); }

  var AC = null;
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(m, when, dur) {
    var c = ac(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + (when || 0);
    o.type = 'triangle'; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.35, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function flash(m, delay) {
    setTimeout(function () {
      document.querySelectorAll('[data-m="' + m + '"]').forEach(function (e) { e.classList.add('down'); setTimeout(function () { e.classList.remove('down'); }, 260); });
    }, (delay || 0) * 1000);
  }
  function playNote(m) { tone(m, 0, 1.2); flash(m, 0); }
  function playTonic(key) { var p = parseKey(key); playNote(60 + (p ? p.root : 0)); }
  function playChord(key) {
    var p = parseKey(key) || { root: 0, minor: false }, r = 60 + p.root;
    [0, p.minor ? 3 : 4, 7].forEach(function (i) { tone(r + i, 0, 1.8); flash(r + i, 0); });
  }
  function playScale(key) {
    var p = parseKey(key) || { root: 0, minor: false }, r = 60 + p.root;
    (p.minor ? [0, 2, 3, 5, 7, 8, 10, 12] : [0, 2, 4, 5, 7, 9, 11, 12]).forEach(function (i, n) { tone(r + i, n * 0.45, 0.6); flash(r + i, n * 0.45); });
  }
  function kbHTML(key) {
    var p = parseKey(key) || { root: 0, minor: false };
    var iv = p.minor ? [0, 2, 3, 5, 7, 8, 10] : [0, 2, 4, 5, 7, 9, 11];
    var lab = p.minor ? ['d', 'r', 'me', 'f', 's', 'le', 'te'] : ['d', 'r', 'm', 'f', 's', 'l', 't'];
    var names = FLATKEYS.indexOf(key) > -1 ? FL : SH;
    var deg = function (pc) { return iv.indexOf(mod12(pc - p.root)); };
    var WH = [0, 2, 4, 5, 7, 9, 11], BL = [1, 3, 6, 8, 10], BPOS = [0, 1, 3, 4, 5];
    var out = '<div class="kbd" role="group" aria-label="Piano keyboard">';
    for (var o = 0; o < 2; o++) {
      WH.forEach(function (pc) {
        var d = deg(pc), cls = d === 0 ? 'tonic' : d > 0 ? 'in' : '';
        out += '<button class="wk ' + cls + '" data-m="' + (60 + o * 12 + pc) + '" aria-label="' + names[pc] + '"><span class="sf">' + (d > -1 ? lab[d] : '') + '</span><span class="nm">' + names[pc] + '</span></button>';
      });
    }
    for (var q = 0; q < 2; q++) {
      BL.forEach(function (pc, j) {
        var d = deg(pc), cls = d === 0 ? 'in tonic' : d > 0 ? 'in' : '';
        var left = (q * 7 + BPOS[j] + 1) * (100 / 14) - 2.15;
        out += '<button class="bk ' + cls + '" style="left:' + left + '%" data-m="' + (60 + q * 12 + pc) + '" aria-label="' + names[pc] + '">' + (d > -1 ? lab[d] : '') + '</button>';
      });
    }
    return out + '</div>';
  }

  /* ---------- lyrics ---------- */
  var SEC = /^\s*(#\s*.+|(intro|verse|stanza|chorus|refrain|bridge|outro|ending|interlude|tag)\s*\d*\s*:?)\s*$/i;
  function singables(ly) {
    var out = []; String(ly || '').split('\n').forEach(function (l) { if (l.trim() && !SEC.test(l)) out.push(l.trim()); }); return out;
  }
  function chartHTML(ly) {
    var n = 0;
    return String(ly || '').split('\n').map(function (l) {
      if (!l.trim()) return '<div class="gap"></div>';
      if (SEC.test(l)) return '<div class="vs">' + esc(l.replace(/^\s*#\s*/, '').replace(/:\s*$/, '')) + '</div>';
      return '<div class="line" data-li="' + (n++) + '">' + esc(l.trim()) + '</div>';
    }).join('');
  }

  /* ---------- songs (saved on this phone) ---------- */
  var st = { view: 'library', cur: null, q: '', editId: null, rec: null, sync: null, recMsg: '', kb: false, recording: false, recSong: null, noMic: false, recMissing: false };
  var songs = [];
  function loadLocal() { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch (e) { return []; } }
  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(songs)); } catch (e) {} }
  function persist(song) {
    song.updated = Date.now();
    var i = songs.findIndex(function (s) { return s.id === song.id; });
    if (i < 0) songs.push(song); else songs[i] = song;
    saveLocal();
  }
  function removeSong(id) {
    var s = byId(id); (s && s.recordings || []).forEach(dropAudio);
    songs = songs.filter(function (x) { return x.id !== id; }); saveLocal();
  }
  var byId = function (id) { return songs.find(function (s) { return s.id === id; }); };
  var curSong = function () { return byId(st.cur); };
  function seed() {
    var seen = false; try { seen = !!localStorage.getItem(SEEDED); } catch (e) {}
    if (songs.length || seen) return;
    songs = [{ id: uid(), title: 'Amazing Grace (example)', key: 'G', music: '', recordings: [], updated: Date.now(),
      lyrics: 'Verse 1\nAmazing grace, how sweet the sound\nThat saved a wretch like me\nI once was lost but now am found\nWas blind but now I see\n\nVerse 2\n\'Twas grace that taught my heart to fear\nAnd grace my fears relieved\nHow precious did that grace appear\nThe hour I first believed' }];
    saveLocal(); try { localStorage.setItem(SEEDED, '1'); } catch (e) {}
  }

  /* ---------- recordings (kept on this phone) ---------- */
  var idbP = null, mem = {}, urls = {};
  function idb() {
    if (idbP) return idbP;
    idbP = new Promise(function (res, rej) {
      try {
        var r = indexedDB.open('rehearsalbook', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('audio'); };
        r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); };
      } catch (e) { rej(e); }
    });
    return idbP;
  }
  function idbDo(mode, fn) {
    return idb().then(function (d) {
      return new Promise(function (res, rej) {
        var tx = d.transaction('audio', mode), rq = fn(tx.objectStore('audio'));
        tx.oncomplete = function () { res(rq && rq.result); }; tx.onerror = tx.onabort = function () { rej(tx.error); };
      });
    });
  }
  function audioPut(id, blob) { return idbDo('readwrite', function (os) { return os.put(blob, id); }).catch(function () { mem[id] = blob; st.memOnly = true; }); }
  function audioGet(id) { return idbDo('readonly', function (os) { return os.get(id); }).then(function (b) { return b || mem[id] || null; }, function () { return mem[id] || null; }); }
  function dropAudio(rec) { delete mem[rec.id]; delete urls[rec.id]; idbDo('readwrite', function (os) { return os['delete'](rec.id); }).catch(function () {}); }
  function recURL(rec) {
    if (urls[rec.id]) return Promise.resolve(urls[rec.id]);
    return audioGet(rec.id).then(function (b) { return b ? (urls[rec.id] = URL.createObjectURL(b)) : null; });
  }
  function fmtDate(t) { return new Date(t).toLocaleString([], { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); }
  function fmtSize(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
  function fmtTime(t) { t = Math.max(0, t | 0); return ((t / 60) | 0) + ':' + ('0' + (t % 60)).slice(-2); }

  function addRecording(song, file) {
    st.recMsg = 'Saving recording…'; var m = $('#recmsg'); if (m) m.textContent = st.recMsg;
    var rec = { id: uid(), name: 'Rehearsal ' + fmtDate(Date.now()), t: Date.now(), size: file.size, marks: [] };
    return audioPut(rec.id, file).then(function () {
      song.recordings = (song.recordings || []).concat(rec); persist(song);
      st.recMsg = st.memOnly ? 'Saved for now, but this browser may not keep it after you close the page.' : '';
      if (st.cur === song.id) return selectRec(rec.id);
    });
  }
  var MREC = null, chunks = [], recTimer = 0, recT0 = 0;
  function startRec(s) {
    aud.pause();
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var mt = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(function (t) { return MediaRecorder.isTypeSupported(t); }) || '';
      MREC = new MediaRecorder(stream, mt ? { mimeType: mt } : undefined); chunks = [];
      MREC.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      MREC.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); }); clearInterval(recTimer);
        var type = (MREC.mimeType || mt || 'audio/webm').split(';')[0], song = byId(st.recSong);
        var f = new File(chunks, 'recording.' + (type.indexOf('mp4') > -1 ? 'm4a' : 'webm'), { type: type });
        st.recording = false; MREC = null;
        if (song && f.size) addRecording(song, f).catch(function () { st.recMsg = 'That recording could not be saved.'; render(); }); else render();
      };
      MREC.start(1000); st.recording = true; st.recSong = s.id; recT0 = Date.now();
      recTimer = setInterval(function () { var e = $('#rectime'); if (e) e.textContent = fmtTime((Date.now() - recT0) / 1000); }, 500);
      render();
    }, function () { st.noMic = true; st.recMsg = 'The microphone is not allowed. Tap Record to use your phone\'s recorder instead, or Choose a file.'; render(); });
  }

  /* ---------- player ---------- */
  var A = { id: null }, curLi = -2;
  function recOf(id) { var s = curSong(); return s && (s.recordings || []).find(function (r) { return r.id === id; }); }
  function loadAudio(rec) {
    if (A.id === rec.id && aud.getAttribute('src')) return Promise.resolve(true);
    return recURL(rec).then(function (u) { if (!u) { A.id = null; return false; } A.id = rec.id; aud.src = u; curLi = -2; return true; });
  }
  function selectRec(id) {
    var rec = recOf(id); st.rec = id; st.sync = null;
    if (!rec) return Promise.resolve();
    return loadAudio(rec).then(function (ok) { st.recMissing = !ok; render(); });
  }
  function togglePlay() {
    if (!aud.getAttribute('src')) return;
    if (aud.paused) { var p = aud.play(); if (p && p.catch) p.catch(function () {}); } else aud.pause();
  }
  function highlight() {
    var rec = A.id && recOf(A.id);
    if (!rec || !rec.marks || !rec.marks.length) return;
    var t = aud.currentTime || 0, li = -1;
    for (var i = 0; i < rec.marks.length; i++) { if (rec.marks[i] <= t) li = i; else break; }
    if (li === curLi) return; curLi = li;
    document.querySelectorAll('.follow .line.on').forEach(function (e) { e.classList.remove('on'); });
    if (li < 0) return;
    var el = $('.follow .line[data-li="' + li + '"]'); if (!el) return;
    el.classList.add('on');
    if (!aud.paused) window.scrollTo({ top: Math.max(0, window.scrollY + el.getBoundingClientRect().top - window.innerHeight * 0.35), behavior: 'smooth' });
  }
  function tickUI() {
    var t = aud.currentTime || 0, d = isFinite(aud.duration) ? aud.duration : 0;
    document.querySelectorAll('[data-seek]').forEach(function (r) { r.max = d || 100; r.value = t; });
    document.querySelectorAll('[data-time]').forEach(function (e) { e.textContent = fmtTime(t) + ' / ' + fmtTime(d); });
    document.querySelectorAll('[data-pp]').forEach(function (b) { b.textContent = aud.paused ? 'Play' : 'Pause'; });
    highlight();
  }
  ['timeupdate', 'play', 'pause', 'loadedmetadata', 'ended', 'seeked'].forEach(function (ev) { aud.addEventListener(ev, tickUI); });
  document.addEventListener('input', function (e) {
    if (e.target.hasAttribute && e.target.hasAttribute('data-seek')) aud.currentTime = +e.target.value;
    if (e.target.id === 'q') { st.q = e.target.value; renderList(); }
  });

  /* ---------- views ---------- */
  function render() {
    if (st.view === 'edit') return renderEdit();
    if (st.view === 'song') { var s = curSong(); if (s) { renderSong(s); curLi = -2; tickUI(); return; } st.view = 'library'; }
    renderLibrary();
  }
  function renderLibrary() {
    $('#app').innerHTML =
      '<header class="head"><div><h1>Rehearsal Book</h1><p class="sub" id="count"></p></div><button class="btn primary" data-act="new">New song</button></header>' +
      '<div><label class="sr" for="q">Search songs</label><input id="q" type="search" placeholder="Search title or lyrics" autocomplete="off" value="' + esc(st.q) + '"></div><div id="list" class="list"></div>';
    renderList();
  }
  function renderList() {
    var q = st.q.trim().toLowerCase();
    var list = songs.filter(function (s) { return !q || (s.title + ' ' + (s.lyrics || '')).toLowerCase().indexOf(q) > -1; })
      .sort(function (a, b) { return a.title.localeCompare(b.title, undefined, { numeric: true }); });
    $('#count').textContent = songs.length + (songs.length === 1 ? ' song' : ' songs') + ' · saved on this phone';
    $('#list').innerHTML = list.length ? list.map(function (s) {
      var rc = (s.recordings || []).length;
      return '<button class="row" data-open="' + esc(s.id) + '"><span class="kb">' + esc(s.key || '–') + '</span><span class="rt"><b>' + esc(s.title) + '</b><small>' + esc(keyLabel(s.key)) + '</small></span>' +
        '<span class="rn">' + (rc ? rc + (rc > 1 ? ' recordings' : ' recording') : '') + '</span></button>';
    }).join('') : '<p class="empty">' + (songs.length ? 'No songs match that search.' : 'No songs yet. Tap New song, then add the lyrics, the do re mi notes and the key.') + '</p>';
  }

  function recSection(s) {
    var recs = s.recordings || [], here = st.recording && st.recSong === s.id;
    var canMic = !st.noMic && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder;
    var first = here ? '<button class="btn danger" data-act="recstop">Stop <span id="rectime" class="rtime">0:00</span></button>'
      : canMic ? '<button class="btn primary" data-act="recstart">Record</button>' : '<label class="btn primary" for="recCap">Record</label>';
    var h = '<section class="blk"><h2>Recordings</h2><div class="actions">' + first + '<label class="btn" for="recPick">Choose a file</label>' +
      '<input class="sr" id="recCap" type="file" accept="audio/*" capture><input class="sr" id="recPick" type="file" accept="audio/*,video/mp4,video/webm"></div>' +
      '<p class="sub" id="recmsg">' + esc(st.recMsg) + '</p>';
    if (recs.length) {
      h += '<div class="recs">' + recs.map(function (r) {
        return '<div class="rec"><button class="recmain" data-rec="' + esc(r.id) + '" aria-pressed="' + (st.rec === r.id) + '"><b>' + esc(r.name) + '</b><small>' +
          esc([fmtSize(r.size), r.marks && r.marks.length ? 'Lyrics synced' : 'Not synced'].join(' · ')) + '</small></button>' +
          '<button class="x" data-recdel="' + esc(r.id) + '" aria-label="Delete recording">&times;</button></div>';
      }).join('') + '</div>';
    } else h += '<p class="empty">No recordings yet. Record your rehearsal and it appears here.</p>';
    if (st.rec && st.recMissing) h += '<p class="err">That recording is not on this phone, so it cannot play.</p>';
    return h + '</section>';
  }
  function dockHTML(s) {
    var rec = recOf(st.rec); if (!rec || st.recMissing) return '';
    var has = rec.marks && rec.marks.length, h = '<div class="dock">';
    h += '<div class="player"><button class="btn primary" data-pp>Play</button><input type="range" data-seek min="0" max="100" step="0.1" value="0" aria-label="Position"><span data-time>0:00 / 0:00</span></div>';
    if (st.sync) {
      var sg = singables(s.lyrics), n = st.sync.marks.length;
      h += sg.length ? '<p class="sub">Press Play. Tap Mark when this line starts (' + (n + 1) + ' of ' + sg.length + ').</p><p class="nextline">' + esc(sg[n]) + '</p>' +
        '<div class="actions"><button class="btn primary big" data-act="mark">Mark line start</button><button class="btn" data-act="undomark">Undo</button><button class="btn" data-act="donesync">Done</button></div>'
        : '<p class="err">Add the lyrics first, then sync.</p>';
    } else {
      h += '<div class="actions"><button class="btn" data-act="sync">' + (has ? 'Sync lyrics again' : 'Sync lyrics to this recording') + '</button>' + (has ? '<button class="btn" data-act="clearsync">Clear sync</button>' : '') + '</div>';
    }
    return h + '</div>';
  }
  function renderSong(s) {
    var p = parseKey(s.key);
    $('#app').innerHTML =
      '<div><button class="link" data-act="back">&larr; All songs</button></div>' +
      '<div class="head"><h1>' + esc(s.title) + '</h1><button class="btn" data-act="edit">Edit</button></div>' +
      '<div class="keycard"><div><span class="lbl">Key</span><b>' + esc(keyLabel(s.key)) + '</b></div><div class="actions">' +
      (p ? '<button class="btn" data-act="pitch">Hear key note</button><button class="btn" data-act="togglekb">' + (st.kb ? 'Hide keyboard' : 'Keyboard') + '</button>' : '') + '</div></div>' +
      (st.kb && p ? '<section class="blk"><div class="actions"><button class="btn primary" data-act="pitch">Key note</button><button class="btn" data-act="chord">Key chord</button><button class="btn" data-act="scale">Play scale</button></div>' + kbHTML(s.key) +
        '<p class="legend">Coloured keys belong to this key. The dark green key is doh. Letters show the sol-fa name. Tap any key to hear it.</p></section>' : '') +
      recSection(s) +
      '<section class="blk"><h2>Notes (do re mi)</h2>' + (s.music && s.music.trim() ? '<pre class="solfa">' + esc(s.music) + '</pre>' : '<p class="empty">No notes yet. Tap Edit to type them.</p>') + '</section>' +
      '<section class="blk"><h2>Lyrics</h2>' + (s.lyrics && s.lyrics.trim() ? '<div class="chart follow">' + chartHTML(s.lyrics) + '</div>' : '<p class="empty">No lyrics yet. Tap Edit to add them.</p>') +
      (A.id && (recOf(A.id) || {}).marks && recOf(A.id).marks.length ? '<p class="sub">Lines light up as the recording plays. Tap a line to jump to it.</p>' : '') + '</section>' +
      dockHTML(s);
  }
  function renderEdit() {
    var s = st.editId ? byId(st.editId) : null, d = s || { title: '', key: 'G', lyrics: '', music: '' };
    var opt = function (k) { return '<option value="' + k + '" ' + (d.key === k ? 'selected' : '') + '>' + keyLabel(k) + '</option>'; };
    $('#app').innerHTML =
      '<div><button class="link" data-act="cancel">&larr; Cancel</button></div><h1>' + (s ? 'Edit song' : 'New song') + '</h1><div class="form">' +
      '<div><label for="f-title">Title</label><input id="f-title" type="text" value="' + esc(d.title) + '" autocomplete="off"></div>' +
      '<div><label for="f-key">Key</label><select id="f-key"><optgroup label="Major">' + MAJ.map(opt).join('') + '</optgroup><optgroup label="Minor">' + MIN.map(opt).join('') + '</optgroup></select></div>' +
      '<div><label for="f-lyrics">Lyrics</label><textarea id="f-lyrics" placeholder="Put verse names such as Verse 1 or Chorus on their own line.">' + esc(d.lyrics) + '</textarea></div>' +
      '<div><label for="f-music">Notes (do re mi)</label><textarea id="f-music" class="mono" wrap="off" placeholder="Type the notes the way you write them. Spacing stays exactly as you type it.">' + esc(d.music) + '</textarea></div>' +
      '<p class="err" id="err" role="alert"></p><div class="actions"><button class="btn primary" data-act="save">Save song</button><button class="btn" data-act="cancel">Cancel</button>' +
      (s ? '<button class="btn danger" data-act="delete">Delete song</button>' : '') + '</div></div>';
  }

  /* ---------- routing and events ---------- */
  function route() {
    var h = location.hash.slice(1);
    aud.pause(); A.id = null; st.rec = null; st.sync = null; st.recMsg = ''; st.recMissing = false; st.kb = false;
    if (h === 'new') { st.view = 'edit'; st.editId = null; }
    else if (h.indexOf('song-') === 0) { st.view = 'song'; st.cur = h.slice(5); }
    else st.view = 'library';
    render(); window.scrollTo(0, 0);
  }
  function go(h) { if (location.hash.slice(1) === h) route(); else location.hash = h; }
  window.addEventListener('hashchange', route);

  document.addEventListener('click', function (e) {
    var ln = e.target.closest('.follow .line[data-li]');
    if (ln) {
      var rr = A.id && recOf(A.id), mk = rr && rr.marks && rr.marks[+ln.dataset.li];
      if (mk !== undefined) { aud.currentTime = mk; if (aud.paused) togglePlay(); }
      return;
    }
    var t = e.target.closest('[data-act],[data-open],[data-m],[data-rec],[data-recdel],[data-pp]');
    if (!t) return;
    var s = curSong(), d = t.dataset;
    if (d.m) return playNote(+d.m);
    if (d.pp !== undefined) return togglePlay();
    if (d.open) return go('song-' + d.open);
    if (d.rec) return selectRec(d.rec);
    if (d.recdel && s) {
      if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Delete?'; setTimeout(function () { t.dataset.armed = ''; t.innerHTML = '&times;'; }, 3500); return; }
      var rec = recOf(d.recdel); if (rec) dropAudio(rec);
      if (A.id === d.recdel) { aud.pause(); aud.removeAttribute('src'); A.id = null; }
      if (st.rec === d.recdel) st.rec = null;
      s.recordings = (s.recordings || []).filter(function (x) { return x.id !== d.recdel; }); persist(s); return render();
    }
    switch (d.act) {
      case 'new': return go('new');
      case 'back': return go('');
      case 'edit': st.view = 'edit'; st.editId = st.cur; return render();
      case 'cancel': if (st.editId) { st.view = 'song'; render(); } else go(''); return;
      case 'pitch': return s && playTonic(s.key);
      case 'chord': return s && playChord(s.key);
      case 'scale': return s && playScale(s.key);
      case 'togglekb': st.kb = !st.kb; return render();
      case 'recstart': return s && startRec(s);
      case 'recstop': if (MREC && MREC.state !== 'inactive') MREC.stop(); return;
      case 'sync': st.sync = { marks: [] }; return render();
      case 'mark':
        if (!s || !st.sync) return;
        st.sync.marks.push(Math.max(0, (aud.currentTime || 0) - 0.15));
        if (st.sync.marks.length >= singables(s.lyrics).length) return finishSync(s); return render();
      case 'undomark': if (st.sync) { st.sync.marks.pop(); render(); } return;
      case 'donesync': return s && finishSync(s);
      case 'clearsync': { var r2 = recOf(st.rec); if (r2) { r2.marks = []; persist(s); curLi = -2; render(); } return; }
      case 'save': return saveEdit();
      case 'delete':
        if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Tap again to delete'; setTimeout(function () { t.dataset.armed = ''; t.textContent = 'Delete song'; }, 4000); return; }
        removeSong(st.editId); st.editId = null; return go('');
    }
  });
  function finishSync(s) {
    var rec = recOf(st.rec);
    if (rec && st.sync && st.sync.marks.length) { rec.marks = st.sync.marks.slice(); persist(s); }
    st.sync = null; curLi = -2; render();
  }
  function saveEdit() {
    var title = $('#f-title').value.trim();
    if (!title) { $('#err').textContent = 'Add a title so you can find this song later.'; $('#f-title').focus(); return; }
    var s = st.editId ? byId(st.editId) : null, song = s || { id: uid(), recordings: [] };
    song.title = title; song.key = $('#f-key').value; song.lyrics = $('#f-lyrics').value; song.music = $('#f-music').value;
    persist(song); st.cur = song.id; st.editId = song.id; st.view = 'song';
    if (location.hash.slice(1) !== 'song-' + song.id) history.replaceState(null, '', '#song-' + song.id);
    render(); window.scrollTo(0, 0);
  }
  document.addEventListener('change', function (e) {
    if (e.target.id !== 'recCap' && e.target.id !== 'recPick') return;
    var f = e.target.files && e.target.files[0], s = curSong(); e.target.value = '';
    if (!f || !s) return;
    addRecording(s, f).catch(function () { st.recMsg = 'That recording could not be saved. Try a smaller file.'; render(); });
  });

  songs = loadLocal(); seed(); route();
})();
</script>
</body>
</html>

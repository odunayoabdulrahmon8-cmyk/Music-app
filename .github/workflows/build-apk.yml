name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Allow the microphone and set the icon
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$MANIFEST"
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in resources/android/mipmap-*; do cp "$d"/*.png "android/app/src/main/res/$(basename "$d")/"; done
          grep -n "RECORD_AUDIO" "$MANIFEST"

      - name: Copy the web app into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Rehearsal-Book.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Rehearsal-Book-apk
          path: Rehearsal-Book.apk

      - name: Publish a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app
          name: Rehearsal Book for Android
          body: Download Rehearsal-Book.apk below, open it on your phone and install it.
          files: Rehearsal-Book.apk
          make_latest: true

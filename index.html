<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Rehearsal Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&family=Schibsted+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one narrow column, phone first. Song list -> song page with five tabs (Lyrics, Music, Keyboard, Recordings, Notes) -> full-screen rehearse mode. */
:root {
  --bg: #F4F6F5;
  --surface: #FFFFFF;
  --ink: #14201D;
  --muted: #5C6B67;
  --line: #DCE3E0;
  --accent: #0B6E63;
  --on-accent: #FFFFFF;
  --accent-soft: #DDF0EC;
  --danger: #B3261E;
  --key-white: #FFFFFF;
  --key-in: #CFEAE4;
  --key-ink: #14201D;
  --key-black: #1B2825;
  --font-ui: 'Schibsted Grotesk', system-ui, sans-serif;
  --font-body: 'Atkinson Hyperlegible', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1513; --surface: #162120; --ink: #E7EFEC; --muted: #93A6A0; --line: #26332F;
    --accent: #55D1BE; --on-accent: #04201C; --accent-soft: #1B3A35; --danger: #FF8A80;
    --key-white: #1E2B29; --key-in: #2E6B61; --key-ink: #E7EFEC; --key-black: #050908;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1513; --surface: #162120; --ink: #E7EFEC; --muted: #93A6A0; --line: #26332F;
  --accent: #55D1BE; --on-accent: #04201C; --accent-soft: #1B3A35; --danger: #FF8A80;
  --key-white: #1E2B29; --key-in: #2E6B61; --key-ink: #E7EFEC; --key-black: #050908;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.wrap > * { min-width: 0; }
h1, h2 { font-family: var(--font-ui); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 1.75rem; overflow-wrap: anywhere; }
p { margin: 0; }
.sub { color: var(--muted); font-size: .9rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr:focus-visible + * , label:has(+ .sr:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

button { font: inherit; color: inherit; cursor: pointer; }
.btn {
  font-family: var(--font-ui); font-weight: 500; font-size: .95rem;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 9px 14px; border-radius: 10px; min-height: 42px;
  display: inline-flex; align-items: center; justify-content: center; text-align: center;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.danger { color: var(--danger); }
.btn.big { min-height: 64px; font-size: 1.1rem; flex: 1; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-family: var(--font-ui); font-weight: 500; text-align: left; }
input, select, textarea {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 44px;
}
textarea { min-height: 220px; resize: vertical; line-height: 1.6; }
textarea.mono { font-family: var(--font-mono); font-size: .9rem; white-space: pre; overflow-x: auto; }
label { font-family: var(--font-ui); font-weight: 500; font-size: .85rem; color: var(--muted); display: block; margin-bottom: 4px; }
label.btn { margin: 0; color: var(--ink); font-size: .95rem; }
label.btn.primary { color: var(--on-accent); }

.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.head > div { min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-family: var(--font-mono); font-weight: 600; font-size: .85rem;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; min-height: 34px;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row {
  display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: center;
  background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 2px; text-align: left; width: 100%;
}
.kb {
  font-family: var(--font-mono); font-weight: 600; font-size: 1.05rem; color: var(--accent);
  background: var(--accent-soft); border-radius: 10px; height: 44px; display: grid; place-items: center;
}
.rt { display: flex; flex-direction: column; min-width: 0; }
.rt b { font-family: var(--font-ui); font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
.rt small { color: var(--muted); font-size: .85rem; }
.rn { font-size: .8rem; color: var(--muted); text-align: right; }
.empty { color: var(--muted); padding: 20px 2px; max-width: 48ch; }

.keycard { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; }
.keycard .lbl { display: block; font-family: var(--font-ui); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.keycard b { font-family: var(--font-ui); font-size: 1.35rem; color: var(--accent); }
.keycard small { display: block; color: var(--ink); }
.bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab {
  background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px; margin-bottom: -1px;
  font-family: var(--font-ui); font-weight: 500; color: var(--muted); white-space: nowrap;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }

.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: 19px; }
.follow { position: relative; }
.chart.follow { max-height: 58vh; overflow-y: auto; }
.line { padding: 3px 8px; border-radius: 8px; overflow-wrap: anywhere; }
.follow .line[data-li] { cursor: pointer; }
.line.on { background: var(--accent-soft); font-weight: 700; }
.sec { font-family: var(--font-ui); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .72em; color: var(--muted); margin: 1.1em 0 .3em 8px; }
.sec:first-child { margin-top: 0; }
.gap { height: .5em; }
.solfa { margin: 0; font-family: var(--font-mono); font-size: .95rem; line-height: 1.8; white-space: pre; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }

.kbd { position: relative; display: flex; height: 176px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--key-white); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.wk {
  flex: 1; min-width: 0; border: 0; border-right: 1px solid var(--line); background: var(--key-white); color: var(--key-ink);
  display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; padding: 0 0 8px;
}
.wk:last-of-type { border-right: 0; }
.wk.in { background: var(--key-in); }
.wk.tonic { background: var(--accent); color: var(--on-accent); }
.wk .sf { font-family: var(--font-mono); font-weight: 600; font-size: 1rem; min-height: 1.4em; }
.wk .nm { font-size: .62rem; opacity: .7; }
.bk {
  position: absolute; top: 0; height: 58%; width: 4.3%; z-index: 2; border: 0; border-radius: 0 0 6px 6px;
  background: var(--key-black); color: #fff; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px;
  font-family: var(--font-mono); font-weight: 600; font-size: .7rem;
}
.bk.in { background: var(--accent); color: var(--on-accent); }
.bk.tonic { outline: 2px solid var(--ink); outline-offset: -2px; }
.down { filter: brightness(.85); }
.legend { font-size: .9rem; color: var(--muted); }

.recbar { display: flex; gap: 10px; flex-wrap: wrap; }
.recs { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.rec { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-bottom: 1px solid var(--line); }
.recmain { background: none; border: 0; text-align: left; padding: 10px 2px; display: flex; flex-direction: column; min-width: 0; }
.recmain b { font-family: var(--font-ui); }
.recmain small { color: var(--muted); }
.recmain[aria-pressed="true"] b { color: var(--accent); }
.player { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.player input[type="range"], .speed input { min-height: 0; padding: 0; border: 0; background: none; accent-color: var(--accent); flex: 1; min-width: 120px; }
.rtime { font-family: var(--font-mono); margin-left: 6px; }
.player span, .speed span { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.syncbox { background: var(--accent-soft); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.nextline { font-size: 1.4rem; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }

.noteform { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 8px; }
.notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.note { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 12px 2px; border-bottom: 1px solid var(--line); }
.note input[type="checkbox"] { width: 22px; height: 22px; min-height: 0; margin-top: 2px; accent-color: var(--accent); }
.note.done .nt { text-decoration: line-through; color: var(--muted); }
.nt { overflow-wrap: anywhere; }
.tag { font-family: var(--font-ui); font-weight: 700; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 7px; margin-right: 8px; }
.x { background: none; border: 0; color: var(--muted); font-size: 1.2rem; width: 40px; height: 40px; }

.form { display: flex; flex-direction: column; gap: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; font-size: .9rem; }
.err { color: var(--danger); font-size: .9rem; min-height: 1.2em; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.status { white-space: nowrap; }

/* Rehearse mode */
.reh {
  position: fixed; inset: 0; z-index: 50; background: var(--bg);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.reh-bar, .reh-foot {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--surface);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
}
.reh-bar { border-bottom: 1px solid var(--line); }
.reh-foot { border-top: 1px solid var(--line); }
.reh .btn { min-height: 40px; padding: 6px 12px; }
.reh select { width: auto; max-width: 100%; min-height: 40px; padding: 6px 10px; }
.reh-body {
  flex: 1; overflow-y: auto; font-size: var(--rs, 26px);
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) 45vh max(16px, env(safe-area-inset-left, 0px));
}
.reh-body h2 { font-size: 1.3em; }
.rmeta { font-family: var(--font-mono); color: var(--muted); font-size: .6em; margin: 4px 0 12px; }
.reh-body .solfa { font-size: .6em; margin-bottom: 16px; }
.speed { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 150px; font-family: var(--font-ui); font-size: .85rem; color: var(--muted); margin: 0; }

@media (max-width: 480px) {
  .noteform { grid-template-columns: 1fr 1fr; }
  .noteform input[type="text"] { grid-column: 1 / -1; grid-row: 2; }
  .two { grid-template-columns: 1fr; }
}
</style>
</head>
<body>


<div id="app" class="wrap"></div>
<audio id="aud" preload="metadata"></audio>

<div id="reh" class="reh" hidden role="dialog" aria-label="Rehearse mode">
  <div class="reh-bar">
    <button class="btn" data-r="close">Close</button>
    <button class="btn" data-r="pitch" id="rpitch">Key note</button>
    <button class="btn" data-r="music" id="rmusic">Music notes off</button>
    <button class="btn" data-r="sm" aria-label="Smaller text">A&minus;</button>
    <button class="btn" data-r="sp" aria-label="Larger text">A+</button>
  </div>
  <div class="reh-body follow" id="rbody"></div>
  <div class="reh-foot">
    <button class="btn primary" data-r="play" id="rplay">Auto-scroll</button>
    <label class="sr" for="rrec">Recording to follow</label>
    <select id="rrec"></select>
    <label class="speed" id="rspeedwrap" for="rspeed">Speed <input id="rspeed" type="range" min="1" max="10" value="3"></label>
    <div class="speed" id="rseekwrap" hidden><label class="sr" for="rseek">Position</label><input id="rseek" type="range" data-seek min="0" max="100" step="0.1" value="0"><span data-time>0:00 / 0:00</span></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var uid = function () { return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); };
  var LS = 'rehearsalbook.songs.v2', SEEDED = 'rehearsalbook.seeded.v2';
  var TAGS = ['Singing', 'Music', 'Key', 'Other'];
  var aud = $('#aud');

  /* ---------- keys and sound ---------- */
  var IDX = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
  var SH = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  var FL = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
  var MAJ = ['C', 'C#', 'Db', 'D', 'D#', 'Eb', 'E', 'F', 'F#', 'Gb', 'G', 'G#', 'Ab', 'A', 'A#', 'Bb', 'B'];
  var MIN = ['Cm', 'C#m', 'Dm', 'Ebm', 'Em', 'Fm', 'F#m', 'Gm', 'G#m', 'Am', 'Bbm', 'Bm'];
  var FLATKEYS = ['F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb', 'Dm', 'Gm', 'Cm', 'Fm', 'Bbm', 'Ebm'];
  var mod12 = function (n) { return ((n % 12) + 12) % 12; };
  function parseKey(k) {
    var m = String(k || '').match(/^([A-G][#b]?)(m?)$/);
    return m && IDX[m[1]] !== undefined ? { root: IDX[m[1]], minor: !!m[2], name: m[1] } : null;
  }
  function keyLabel(k) { var p = parseKey(k); return p ? p.name + (p.minor ? ' minor' : ' major') : (k || 'No key'); }

  var AC = null;
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(m, when, dur) {
    var c = ac(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + (when || 0);
    o.type = 'triangle'; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.35, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function flash(m, delay) {
    setTimeout(function () {
      document.querySelectorAll('[data-m="' + m + '"]').forEach(function (e) { e.classList.add('down'); setTimeout(function () { e.classList.remove('down'); }, 260); });
    }, (delay || 0) * 1000);
  }
  function tonicMidi(key) { var p = parseKey(key); return p ? 60 + p.root : 60; }
  function playNote(m) { tone(m, 0, 1.2); flash(m, 0); }
  function playTonic(key) { playNote(tonicMidi(key)); }
  function playChord(key) {
    var p = parseKey(key) || { root: 0, minor: false }, r = 60 + p.root;
    [0, p.minor ? 3 : 4, 7].forEach(function (i) { tone(r + i, 0, 1.8); flash(r + i, 0); });
  }
  function playScale(key) {
    var p = parseKey(key) || { root: 0, minor: false }, r = 60 + p.root;
    (p.minor ? [0, 2, 3, 5, 7, 8, 10, 12] : [0, 2, 4, 5, 7, 9, 11, 12]).forEach(function (i, n) { tone(r + i, n * 0.45, 0.6); flash(r + i, n * 0.45); });
  }

  function kbHTML(key) {
    var p = parseKey(key) || { root: 0, minor: false };
    var iv = p.minor ? [0, 2, 3, 5, 7, 8, 10] : [0, 2, 4, 5, 7, 9, 11];
    var lab = p.minor ? ['d', 'r', 'me', 'f', 's', 'le', 'te'] : ['d', 'r', 'm', 'f', 's', 'l', 't'];
    var names = FLATKEYS.indexOf(key) > -1 ? FL : SH;
    var deg = function (pc) { var i = iv.indexOf(mod12(pc - p.root)); return i; };
    var WH = [0, 2, 4, 5, 7, 9, 11], BL = [1, 3, 6, 8, 10], BPOS = [0, 1, 3, 4, 5];
    var out = '<div class="kbd" role="group" aria-label="Piano keyboard">';
    for (var o = 0; o < 2; o++) {
      WH.forEach(function (pc) {
        var d = deg(pc), cls = d === 0 ? 'tonic' : d > 0 ? 'in' : '';
        out += '<button class="wk ' + cls + '" data-m="' + (60 + o * 12 + pc) + '" aria-label="' + names[pc] + '"><span class="sf">' + (d > -1 ? lab[d] : '') + '</span><span class="nm">' + names[pc] + '</span></button>';
      });
    }
    for (var q = 0; q < 2; q++) {
      BL.forEach(function (pc, j) {
        var d = deg(pc), cls = d === 0 ? 'in tonic' : d > 0 ? 'in' : '';
        var left = (q * 7 + BPOS[j] + 1) * (100 / 14) - 2.15;
        out += '<button class="bk ' + cls + '" style="left:' + left + '%" data-m="' + (60 + q * 12 + pc) + '" aria-label="' + names[pc] + '">' + (d > -1 ? lab[d] : '') + '</button>';
      });
    }
    return out + '</div>';
  }

  /* ---------- lyrics helpers ---------- */
  var SEC = /^\s*(#\s*.+|(intro|verse|stanza|chorus|refrain|bridge|outro|ending|interlude|tag)\s*\d*\s*:?)\s*$/i;
  function singables(ly) {
    var out = [];
    String(ly || '').split('\n').forEach(function (l) { if (l.trim() && !SEC.test(l)) out.push(l.trim()); });
    return out;
  }
  function chartHTML(ly) {
    var n = 0;
    return String(ly || '').split('\n').map(function (l) {
      if (!l.trim()) return '<div class="gap"></div>';
      if (SEC.test(l)) return '<div class="sec">' + esc(l.replace(/^\s*#\s*/, '').replace(/:\s*$/, '')) + '</div>';
      return '<div class="line" data-li="' + (n++) + '">' + esc(l.trim()) + '</div>';
    }).join('');
  }

  /* ---------- state + song storage ---------- */
  var st = { view: 'library', cur: null, tab: 'lyrics', q: '', key: '', editId: null, dbReady: false, synced: false, rec: null, sync: null, recMsg: '' };
  var songs = [], db = null, assets = null, migrated = false, chains = {};

  function loadLocal() { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch (e) { return []; } }
  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(songs)); } catch (e) {} }
  var clean = function (o) { return JSON.parse(JSON.stringify(o)); };
  function dbWrite(id, fn) { chains[id] = (chains[id] || Promise.resolve()).then(fn).catch(function (e) { console.warn('save failed', e); }); }
  function persist(song) {
    song.updated = Date.now();
    var i = songs.findIndex(function (s) { return s.id === song.id; });
    if (i < 0) songs.push(song); else songs[i] = song;
    saveLocal();
    if (db) { var body = clean(song); dbWrite(song.id, function () { return db.doc('songs/' + song.id).set(body); }); }
  }
  function removeSong(id) {
    var s = songs.find(function (x) { return x.id === id; });
    (s && s.recordings || []).forEach(dropAudio);
    songs = songs.filter(function (x) { return x.id !== id; });

    $('#rspeedwrap').hidden = !!R.rec; $('#rseekwrap').hidden = !R.rec;
    $('#rplay').textContent = R.rec ? (aud.paused ? 'Play' : 'Pause') : (R.playing ? 'Pause' : 'Auto-scroll');
    curLi = -2; tickUI();
  }
  function openReh() {
    var s = curSong(); if (!s) return;
    R.rec = st.rec && (s.recordings || []).some(function (r) { return r.id === st.rec; }) ? st.rec : '';
    $('#reh').hidden = false; document.body.style.overflow = 'hidden';
    renderReh(); $('#rbody').scrollTop = 0;
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { R.wl = w; }, function () {}); } catch (e) {}
  }
  function closeReh() {
    setPlaying(false); aud.pause(); $('#reh').hidden = true; document.body.style.overflow = '';
    try { if (R.wl) R.wl.release(); } catch (e) {} R.wl = null;
    if (st.view === 'song') render();
  }
  function setPlaying(on) {
    R.playing = on; if (!R.rec) $('#rplay').textContent = on ? 'Pause' : 'Auto-scroll';
    cancelAnimationFrame(R.raf); R.last = 0;
    if (on) { R.pos = $('#rbody').scrollTop; R.raf = requestAnimationFrame(tick); }
  }
  function tick(t) {
    if (!R.playing) return;
    var el = $('#rbody'); if (!R.last) R.last = t;
    var dt = (t - R.last) / 1000; R.last = t;
    if (Math.abs(el.scrollTop - R.pos) > 1.5) R.pos = el.scrollTop;
    R.pos += R.speed * 8 * dt; el.scrollTop = R.pos;
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 1) return setPlaying(false);
    R.raf = requestAnimationFrame(tick);
  }
  $('#rspeed').addEventListener('input', function (e) { R.speed = +e.target.value; });
  $('#rrec').addEventListener('change', function (e) {
    setPlaying(false); aud.pause(); R.rec = e.target.value;
    if (!R.rec) { A.follow = false; document.querySelectorAll('.follow .line.on').forEach(function (x) { x.classList.remove('on'); }); }
    else { A.follow = true; var rec = recOf(R.rec); if (rec) loadAudio(rec).then(function (ok) { if (!ok) { R.rec = ''; renderReh(); } }); }
    $('#rspeedwrap').hidden = !!R.rec; $('#rseekwrap').hidden = !R.rec;
    $('#rplay').textContent = R.rec ? 'Play' : 'Auto-scroll';
  });

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var ln = e.target.closest('.follow .line[data-li]');
    if (ln) {
      var rr = A.follow && A.id && recOf(A.id), mk = rr && rr.marks && rr.marks[+ln.dataset.li];
      if (mk !== undefined) { aud.currentTime = mk; if (aud.paused) togglePlay(); }
      return;
    }
    var t = e.target.closest('[data-act],[data-open],[data-tab],[data-tog],[data-del],[data-key],[data-r],[data-m],[data-rec],[data-recdel],[data-pp]');
    if (!t) return;
    var s = curSong(), d = t.dataset;
    if (d.m) return playNote(+d.m);
    if (d.pp !== undefined) return togglePlay();
    if (d.open) return go('song-' + d.open);
    if (d.tab) { st.tab = d.tab; return render(); }
    if (d.key !== undefined && t.classList.contains('chip')) { st.key = d.key; renderChips(); return renderList(); }
    if (d.tog && s) { var n = s.notes.find(function (x) { return x.id === d.tog; }); if (n) { n.done = !n.done; persist(s); render(); } return; }
    if (d.del && s) { s.notes = s.notes.filter(function (x) { return x.id !== d.del; }); persist(s); return render(); }
    if (d.rec) return selectRec(d.rec);
    if (d.recdel && s) {
      if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Delete?'; setTimeout(function () { t.dataset.armed = ''; t.innerHTML = '&times;'; }, 3500); return; }
      var rec = recOf(d.recdel); if (rec) dropAudio(rec);
      if (A.id === d.recdel) { aud.pause(); aud.removeAttribute('src'); A.id = null; }
      if (st.rec === d.recdel) st.rec = null;
      s.recordings = (s.recordings || []).filter(function (x) { return x.id !== d.recdel; }); persist(s); return render();
    }
    if (d.r) {
      if (d.r === 'close') closeReh();
      else if (d.r === 'pitch') { if (s) playTonic(s.key); }
      else if (d.r === 'music') { R.music = !R.music; renderReh(); }
      else if (d.r === 'sm') { R.size = Math.max(14, R.size - 2); renderReh(); }
      else if (d.r === 'sp') { R.size = Math.min(48, R.size + 2); renderReh(); }
      else if (d.r === 'play') { if (R.rec) togglePlay(); else setPlaying(!R.playing); }
      return;
    }
    switch (d.act) {
      case 'new': return go('new');
      case 'back': return go('');
      case 'edit': st.view = 'edit'; st.editId = st.cur; return render();
      case 'cancel': if (st.editId) { st.view = 'song'; render(); } else go(''); return;
      case 'rehearse': return openReh();
      case 'pitch': return s && playTonic(s.key);
      case 'chord': return s && playChord(s.key);
      case 'scale': return s && playScale(s.key);
      case 'recstart': return s && startRec(s);
      case 'recstop': if (MREC && MREC.state !== 'inactive') MREC.stop(); return;
      case 'sync': st.sync = { marks: [] }; return render();
      case 'mark':
        if (!s || !st.sync) return;
        var sg = singables(s.lyrics);
        st.sync.marks.push(Math.max(0, (aud.currentTime || 0) - 0.15));
        if (st.sync.marks.length >= sg.length) return finishSync(s); return render();
      case 'undomark': if (st.sync) { st.sync.marks.pop(); render(); } return;
      case 'donesync': return s && finishSync(s);
      case 'clearsync': { var r2 = recOf(st.rec); if (r2) { r2.marks = []; persist(s); render(); } return; }
      case 'save': return saveEdit();
      case 'delete':
        if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Tap again to delete'; setTimeout(function () { t.dataset.armed = ''; t.textContent = 'Delete song'; }, 4000); return; }
        removeSong(st.editId); st.editId = null; return go('');
    }
  });

  function finishSync(s) {
    var rec = recOf(st.rec);
    if (rec && st.sync && st.sync.marks.length) { rec.marks = st.sync.marks.slice(); persist(s); }
    st.sync = null; render();
  }

  function saveEdit() {
    var title = $('#f-title').value.trim();
    if (!title) { $('#err').textContent = 'Add a title so you can find this song later.'; $('#f-title').focus(); return; }
    var s = st.editId ? byId(st.editId) : null;
    var song = s || { id: uid(), notes: [], recordings: [] };
    song.title = title; song.hymn = $('#f-hymn').value.trim(); song.key = $('#f-key').value; song.keyNote = $('#f-keynote').value.trim();
    song.lyrics = $('#f-lyrics').value; song.music = $('#f-music').value;
    persist(song); st.cur = song.id; st.editId = song.id; st.view = 'song'; st.tab = 'lyrics';
    if (location.hash.slice(1) !== 'song-' + song.id) history.replaceState(null, '', '#song-' + song.id);
    render(); window.scrollTo(0, 0);
  }

  document.addEventListener('input', function (e) { if (e.target.id === 'q') { st.q = e.target.value; renderList(); } });
  document.addEventListener('change', function (e) {
    if (e.target.id !== 'recCap' && e.target.id !== 'recPick') return;
    var f = e.target.files && e.target.files[0], s = curSong(); e.target.value = '';
    if (!f || !s) return;
    addRecording(s, f).catch(function () { st.recMsg = 'That recording could not be saved. Try a smaller file.'; render(); });
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'noteform') return;
    e.preventDefault();
    var s = curSong(), text = $('#ntext').value.trim(); if (!s || !text) return;
    s.notes = s.notes || []; s.notes.push({ id: uid(), tag: $('#ntag').value, text: text, done: false, t: Date.now() });
    persist(s); render();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#reh').hidden) closeReh(); });

  /* ---------- boot ---------- */
  songs = loadLocal(); seed();
  route();
  initDb();
})();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
